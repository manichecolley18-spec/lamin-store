<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamin Store - Streetwear & Perfumes</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f5f5f5;color:#333}
header{background:#000;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:2em;letter-spacing:2px}
nav{margin-top:10px}
nav a{color:#fff;margin:0 15px;text-decoration:none;font-weight:bold}
.hero{background:#111;color:#fff;text-align:center;padding:80px 20px;font-size:2.2em;font-weight:bold}
.container{max-width:1200px;margin:40px auto;padding:20px}
h2{text-align:center;margin-bottom:30px;font-size:1.8em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px}
.card{background:#fff;border-radius:12px;padding:15px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,0.1)}
.card img{width:100%;height:300px;object-fit:cover;border-radius:8px}
.card h3{margin:12px 0 5px}
.price{color:#e63946;font-weight:bold;font-size:1.3em}
footer{background:#000;color:#fff;text-align:center;padding:25px;margin-top:50px}
</style>
</head>
<body>
<header>
<h1>LAMIN STORE</h1>
<nav>
<a href="#jerseys">Jerseys</a>
<a href="#perfumes">Perfumes</a>
<a href="#contact">Contact</a>
</nav>
</header>

<div class="hero">Streetwear Jerseys + Premium Perfumes</div>

<div class="container">
<h2 id="jerseys">🔥 Streetwear Jerseys</h2>
<div class="grid">
  <div class="card">
    <img src="278B51E9-E7F3-4703-B918-22BF52F1E4AA_1_105_c.jpeg">
    <h3>White Jersey #73</h3>
    <p class="price">$45</p>
  </div>
  
  <div class="card">
    <img src="PASTE_OTHER_JERSEY_FILENAME">
    <h3>Jersey 2</h3>
    <p class="price">$45</p>
  </div>
</div>

<h2 id="perfumes" style="margin-top:60px">✨ Premium Perfumes</h2>
<div class="grid">
  <div class="card">
    <img src="PASTE_PERFUME_FILENAME">
    <h3>Luxury Perfume</h3>
    <p class="price">$80</p>
  </div>
</div>

<h2 id="contact" style="margin-top:60px">Contact Us</h2>
<div class="card">
<p><b>WhatsApp:</b> +220 XXXX<br>
<b>Instagram:</b> @laminstore<br>
<b>Location:</b> The Gambia</p>
</div>
</div>

<footer>
<p>©️ 2026 Lamin Store. All rights reserved.</p>
</footer>
</body>
</html>
